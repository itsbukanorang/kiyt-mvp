name: kiyt-mvp

services:
  edge:
    image: nginx:1.30.6-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:18180:8080"

    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - console
      - gateway

    networks:
      - kiyt-private

  console:
    build:
      context: ./apps/console
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "3000"

    networks:
      - kiyt-private

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile

    image: kiyt-gateway:module1

    restart: unless-stopped

    env_file:
      - /home/kiyt-mvp/private/runtime.env

    environment:
      KIYT_RUNTIME_URL: http://runtime:8000
      RUST_LOG: info

    expose:
      - "8080"

    depends_on:
      - runtime

    networks:
      - kiyt-private

  runtime:
    build:
      context: ./services/runtime
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - /home/kiyt-mvp/private/runtime.env

    expose:
      - "8000"

    networks:
      - kiyt-private

  postgres:
    image: postgres:17.11-bookworm

    restart: unless-stopped

    env_file:
      - /home/kiyt-mvp/private/postgres.env

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - kiyt-private

  qdrant:
    image: qdrant/qdrant:v1.20.0

    restart: unless-stopped

    env_file:
      - /home/kiyt-mvp/private/qdrant.env

    volumes:
      - qdrant-data:/qdrant/storage

    networks:
      - kiyt-private

networks:
  kiyt-private:
    driver: bridge

volumes:
  postgres-data:
    name: kiyt-mvp-postgres-data

  qdrant-data:
    name: kiyt-mvp-qdrant-data
