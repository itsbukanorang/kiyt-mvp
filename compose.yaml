name: kiyt-mvp

services:
  edge:
    image: nginx:1.30.6-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:18180:8080"

    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - console
      - gateway

    networks:
      - kiyt-private

  console:
    build:
      context: ./apps/console
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "3000"

    networks:
      - kiyt-private

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile

    image: kiyt-gateway:module1

    restart: unless-stopped

    env_file:
      - /home/kiyt-mvp/private/runtime.env

    environment:
      KIYT_RUNTIME_URL: http://runtime:8000
      RUST_LOG: info

    expose:
      - "8080"

    depends_on:
      - runtime

    networks:
      - kiyt-private

  runtime:
    build:
      context: ./services/runtime
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - /home/kiyt-mvp/private/runtime.env

    expose:
      - "8000"

    networks:
      - kiyt-private

networks:
  kiyt-private:
    driver: bridge
